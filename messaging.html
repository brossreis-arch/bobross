<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>REIS · Messages</title>
<style>
  /* ----------------------------------------------------------------------
     Design tokens — REIS aesthetic: typographic, restrained, dark-capable.
     Single source of truth for color/space/type. Light + dark via prefers.
  ---------------------------------------------------------------------- */
  :root {
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --bg:        #fafafa;
    --surface:   #ffffff;
    --surface-2: #f2f2f3;
    --border:    #e3e3e6;
    --text:      #1a1a1c;
    --text-dim:  #6b6b72;
    --accent:    #1a1a1c;
    --accent-fg: #ffffff;
    --danger:    #b42318;
    --focus:     #2563eb;

    --radius: 10px;
    --gap: 16px;
    --maxw: 720px;

    --shadow: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.04);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg:        #0d0d0f;
      --surface:   #161618;
      --surface-2: #1f1f23;
      --border:    #2a2a2f;
      --text:      #f2f2f3;
      --text-dim:  #9a9aa2;
      --accent:    #f2f2f3;
      --accent-fg: #0d0d0f;
      --danger:    #f87171;
      --focus:     #60a5fa;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: var(--maxw);
    min-height: 100%;
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  /* ---- Header ---------------------------------------------------------- */
  .app__header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .app__title {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .app__subtitle {
    margin: 2px 0 0;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: .04em;
  }
  .toolbar { display: flex; gap: 8px; }

  /* ---- Buttons --------------------------------------------------------- */
  .btn {
    font: inherit;
    font-size: 14px;
    font-weight: 600;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: var(--accent-fg);
    border-radius: var(--radius);
    padding: 0 18px;
    height: 44px;
    cursor: pointer;
    transition: opacity .12s ease;
    white-space: nowrap;
  }
  .btn:hover { opacity: .88; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }

  .btn--ghost {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
    height: 32px;
    padding: 0 12px;
    font-size: 12px;
    font-weight: 500;
  }

  /* ---- Status banner --------------------------------------------------- */
  .status {
    margin: 0;
    padding: 10px 24px;
    font-size: 13px;
    background: var(--surface-2);
    color: var(--text-dim);
    border-bottom: 1px solid var(--border);
  }
  .status[data-tone="error"] { color: var(--danger); }
  .status[hidden] { display: none; }

  /* ---- Message log ----------------------------------------------------- */
  .log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  .empty {
    margin: auto;
    text-align: center;
    color: var(--text-dim);
    font-size: 14px;
    max-width: 36ch;
  }

  .msg {
    display: flex;
    flex-direction: column;
    gap: 4px;
    animation: rise .18s ease-out;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  @media (prefers-reduced-motion: reduce) { .msg { animation: none; } }

  .msg__meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    font-size: 12px;
  }
  .msg__author { font-weight: 600; color: var(--text); }
  .msg__time   { color: var(--text-dim); }
  .msg__edited { color: var(--text-dim); font-style: italic; }

  /* Reply reference shown above a message body */
  .msg__replyref {
    font-size: 12px;
    color: var(--text-dim);
    border-left: 2px solid var(--border);
    padding: 2px 0 2px 10px;
    margin-bottom: 2px;
  }
  .msg__replyref b { color: var(--text); font-weight: 600; }

  .msg__body {
    margin: 0;
    padding: 10px 14px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 14px;
  }

  /* Per-message actions, revealed on hover/focus-within */
  .msg__actions {
    display: flex;
    gap: 4px;
    margin-top: 2px;
    opacity: 0;
    transition: opacity .12s ease;
  }
  .msg:hover .msg__actions,
  .msg:focus-within .msg__actions { opacity: 1; }
  @media (hover: none) { .msg__actions { opacity: 1; } }

  .msg__action {
    font: inherit;
    font-size: 12px;
    background: none;
    border: none;
    color: var(--text-dim);
    cursor: pointer;
    padding: 2px 6px;
    border-radius: 6px;
  }
  .msg__action:hover { color: var(--text); background: var(--surface-2); }
  .msg__action--danger:hover { color: var(--danger); }

  /* Inline edit form */
  .edit { display: flex; flex-direction: column; gap: 8px; }
  .edit__input {
    font: inherit; font-size: 14px;
    color: var(--text); background: var(--surface-2);
    border: 1px solid var(--focus); border-radius: var(--radius);
    padding: 10px 12px; resize: vertical; min-height: 60px; line-height: 1.45;
  }
  .edit__actions { display: flex; gap: 8px; }

  /* ---- Composer -------------------------------------------------------- */
  .composer-wrap { border-top: 1px solid var(--border); background: var(--surface); }

  /* "Replying to" chip above the composer */
  .replying {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 8px 16px; font-size: 12px; color: var(--text-dim);
    background: var(--surface-2); border-bottom: 1px solid var(--border);
  }
  .replying b { color: var(--text); font-weight: 600; }
  .replying[hidden] { display: none; }
  .replying__cancel {
    font: inherit; font-size: 12px; background: none; border: none;
    color: var(--text-dim); cursor: pointer; text-decoration: underline;
  }
  .replying__cancel:hover { color: var(--text); }

  .composer {
    padding: 14px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  .composer__input {
    flex: 1;
    resize: none;
    font: inherit;
    font-size: 14px;
    color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    min-height: 44px;
    max-height: 160px;
    line-height: 1.45;
  }
  .composer__input::placeholder { color: var(--text-dim); }

  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .hint { font-size: 11px; color: var(--text-dim); padding: 0 16px 10px; margin: -4px 0 0; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap;
  }
</style>
</head>
<body>
  <main class="app" aria-label="Messages">
    <header class="app__header">
      <div>
        <h1 class="app__title">Messages</h1>
        <p class="app__subtitle">Project feedback &amp; discussion</p>
      </div>
      <div class="toolbar">
        <button type="button" class="btn btn--ghost" id="export">Export</button>
        <button type="button" class="btn btn--ghost" id="import">Import</button>
        <input type="file" id="importFile" accept="application/json,.json" class="sr-only" aria-hidden="true" tabindex="-1" />
      </div>
    </header>

    <p class="status" id="status" role="status" hidden></p>

    <section class="log" id="log" role="log" aria-live="polite" aria-label="Message history" tabindex="0"></section>

    <div class="composer-wrap">
      <div class="replying" id="replying" hidden>
        <span id="replyingLabel"></span>
        <button type="button" class="replying__cancel" id="replyingCancel">Cancel reply</button>
      </div>
      <form class="composer" id="composer" autocomplete="off">
        <label for="input" class="sr-only">Write a message</label>
        <textarea
          id="input"
          class="composer__input"
          placeholder="Write a message…  (Enter to send, Shift+Enter for newline)"
          rows="1"
          aria-describedby="hint"></textarea>
        <button type="submit" class="btn" id="send" disabled>Send</button>
      </form>
      <p class="hint" id="hint">Enter to send · Shift+Enter for a new line</p>
    </div>
  </main>

<script>
"use strict";
/* ======================================================================
   REIS Messaging Module — v1
   Single-file, zero-dependency. Layered IIFE: Store · Model · Render · Controller.
   Security note: user content is rendered with textContent ONLY (see Render).
   ====================================================================== */
(function () {

  /* --------------------------------------------------------------------
     Store — the ONLY code that touches persistence.
     parse() is shared by load() and importJSON() so on-disk and imported
     data go through the exact same validation.
  -------------------------------------------------------------------- */
  const Store = (() => {
    const KEY = "reis.messages.v1";
    const SCHEMA_VERSION = 1;

    const emptyState = () => ({ schemaVersion: SCHEMA_VERSION, messages: [] });

    function isValidMessage(m) {
      return m && typeof m.id === "string"
        && typeof m.author === "string"
        && typeof m.body === "string"
        && typeof m.createdAt === "number";
    }

    // Coerce an arbitrary parsed object into a clean, valid state.
    function coerce(parsed) {
      const messages = Array.isArray(parsed?.messages)
        ? parsed.messages.filter(isValidMessage).map((m) => ({
            id: m.id,
            author: m.author,
            body: m.body,
            createdAt: m.createdAt,
            editedAt: typeof m.editedAt === "number" ? m.editedAt : null,
            replyTo: typeof m.replyTo === "string" ? m.replyTo : null,
          }))
        : [];
      return { schemaVersion: SCHEMA_VERSION, messages };
    }

    // parse text -> { state, warning?, error? }. Never throws.
    function parse(raw) {
      try {
        return { state: coerce(JSON.parse(raw)) };
      } catch {
        return { state: emptyState(), error: "Data was unreadable and could not be parsed." };
      }
    }

    function load() {
      let raw;
      try { raw = localStorage.getItem(KEY); }
      catch { return { state: emptyState(), warning: "Storage unavailable — messages won't persist." }; }
      if (!raw) return { state: emptyState() };
      const res = parse(raw);
      if (res.error) return { state: emptyState(), warning: "Saved messages were unreadable and could not be loaded." };
      return { state: res.state };
    }

    function save(state) {
      try { localStorage.setItem(KEY, JSON.stringify(state)); return { ok: true }; }
      catch { return { ok: false, error: "Could not save — storage is full or unavailable." }; }
    }

    function importJSON(text) { return parse(text); }

    return { load, save, importJSON, emptyState, SCHEMA_VERSION };
  })();

  /* --------------------------------------------------------------------
     Model — pure functions. No DOM, no storage.
  -------------------------------------------------------------------- */
  const Model = (() => {
    const MAX_LEN = 4000;

    function validateBody(raw) {
      const body = String(raw ?? "").trim();
      if (!body) return { ok: false, reason: "empty" };
      if (body.length > MAX_LEN) return { ok: false, reason: "too-long" };
      return { ok: true, body };
    }

    function createMessage(body, author, replyTo) {
      return {
        id: (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2)),
        author: author || "You",
        body,
        createdAt: Date.now(),
        editedAt: null,
        replyTo: replyTo || null,
      };
    }

    // Pure transforms return NEW arrays (no in-place mutation of caller state).
    function editMessage(messages, id, newBody) {
      return messages.map((m) => m.id === id ? { ...m, body: newBody, editedAt: Date.now() } : m);
    }
    function deleteMessage(messages, id) {
      // Remove the message; surviving replies to it are re-pointed to null.
      return messages
        .filter((m) => m.id !== id)
        .map((m) => m.replyTo === id ? { ...m, replyTo: null } : m);
    }
    const findById = (messages, id) => messages.find((m) => m.id === id) || null;

    return { validateBody, createMessage, editMessage, deleteMessage, findById, MAX_LEN };
  })();

  /* --------------------------------------------------------------------
     Render — the ONLY code that writes to the message log.
     Uses textContent exclusively for user data => XSS is structurally
     impossible, not merely "remembered."
  -------------------------------------------------------------------- */
  const Render = (() => {
    const logEl = document.getElementById("log");
    const statusEl = document.getElementById("status");

    function relativeTime(ts) {
      const s = Math.floor((Date.now() - ts) / 1000);
      if (s < 5) return "just now";
      if (s < 60) return s + "s ago";
      const m = Math.floor(s / 60);
      if (m < 60) return m + "m ago";
      const h = Math.floor(m / 60);
      if (h < 24) return h + "h ago";
      const d = Math.floor(h / 24);
      if (d < 7) return d + "d ago";
      return new Date(ts).toLocaleDateString();
    }

    const truncate = (t, n) => t.length > n ? t.slice(0, n - 1) + "…" : t;

    // A small labelled action button (Reply / Edit / Delete).
    function actionBtn(label, action, id, danger) {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "msg__action" + (danger ? " msg__action--danger" : "");
      b.textContent = label;
      b.dataset.action = action;
      b.dataset.id = id;
      return b;
    }

    function renderReplyRef(parent) {
      const ref = document.createElement("div");
      ref.className = "msg__replyref";
      if (!parent) { ref.textContent = "In reply to a deleted message"; return ref; }
      const who = document.createElement("b");
      who.textContent = parent.author;                 // safe
      ref.append("Replying to ", who, ": " + truncate(parent.body.replace(/\s+/g, " "), 60)); // safe (text node)
      return ref;
    }

    // editingId (optional): render this message as an inline edit form.
    function renderMessage(m, allMessages, editingId) {
      const wrap = document.createElement("article");
      wrap.className = "msg";
      wrap.dataset.id = m.id;

      if (m.replyTo) wrap.append(renderReplyRef(Model.findById(allMessages, m.replyTo)));

      const meta = document.createElement("div");
      meta.className = "msg__meta";
      const author = document.createElement("span");
      author.className = "msg__author";
      author.textContent = m.author;                   // safe
      const time = document.createElement("time");
      time.className = "msg__time";
      time.dateTime = new Date(m.createdAt).toISOString();
      time.textContent = relativeTime(m.createdAt);
      time.title = new Date(m.createdAt).toLocaleString();
      meta.append(author, time);
      if (m.editedAt) {
        const edited = document.createElement("span");
        edited.className = "msg__edited";
        edited.textContent = "· edited";
        edited.title = "Edited " + new Date(m.editedAt).toLocaleString();
        meta.append(edited);
      }
      wrap.append(meta);

      if (m.id === editingId) {
        // Inline edit form
        const form = document.createElement("div");
        form.className = "edit";
        const ta = document.createElement("textarea");
        ta.className = "edit__input";
        ta.value = m.body;                             // safe (value, not HTML)
        ta.dataset.editInput = m.id;
        const actions = document.createElement("div");
        actions.className = "edit__actions";
        const save = document.createElement("button");
        save.type = "button"; save.className = "btn btn--ghost";
        save.textContent = "Save"; save.dataset.action = "edit-save"; save.dataset.id = m.id;
        const cancel = document.createElement("button");
        cancel.type = "button"; cancel.className = "btn btn--ghost";
        cancel.textContent = "Cancel"; cancel.dataset.action = "edit-cancel"; cancel.dataset.id = m.id;
        actions.append(save, cancel);
        form.append(ta, actions);
        wrap.append(form);
      } else {
        const body = document.createElement("p");
        body.className = "msg__body";
        body.textContent = m.body;                     // safe: never parsed as HTML
        wrap.append(body);

        const actions = document.createElement("div");
        actions.className = "msg__actions";
        actions.append(
          actionBtn("Reply", "reply", m.id, false),
          actionBtn("Edit", "edit", m.id, false),
          actionBtn("Delete", "delete", m.id, true),
        );
        wrap.append(actions);
      }
      return wrap;
    }

    function renderLog(messages, editingId) {
      const atBottom = logEl.scrollHeight - logEl.scrollTop - logEl.clientHeight < 40;
      logEl.replaceChildren();                         // full re-render: no state/DOM desync
      if (!messages.length) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent = "No messages yet. Start the conversation below.";
        logEl.append(empty);
        return;
      }
      const frag = document.createDocumentFragment();
      for (const m of messages) frag.append(renderMessage(m, messages, editingId));
      logEl.append(frag);
      if (atBottom) logEl.scrollTop = logEl.scrollHeight;
    }

    function renderReplyingBanner(parent) {
      const bar = document.getElementById("replying");
      const label = document.getElementById("replyingLabel");
      if (!parent) { bar.hidden = true; label.textContent = ""; return; }
      label.replaceChildren("Replying to ");
      const who = document.createElement("b");
      who.textContent = parent.author;                 // safe
      label.append(who);
      bar.hidden = false;
    }

    function setStatus(text, tone) {
      if (!text) { statusEl.hidden = true; statusEl.textContent = ""; return; }
      statusEl.hidden = false;
      statusEl.textContent = text;
      statusEl.dataset.tone = tone || "info";
    }

    return { renderLog, renderReplyingBanner, setStatus };
  })();

  /* --------------------------------------------------------------------
     Controller — wires events -> Model -> Store -> Render.
  -------------------------------------------------------------------- */
  const Controller = (() => {
    const form = document.getElementById("composer");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const logEl = document.getElementById("log");
    const exportBtn = document.getElementById("export");
    const importBtn = document.getElementById("import");
    const importFile = document.getElementById("importFile");
    const replyingCancel = document.getElementById("replyingCancel");

    let state = Store.emptyState();
    let replyingTo = null;   // id of message being replied to
    let editingId = null;    // id of message being edited inline

    function rerender() {
      Render.renderLog(state.messages, editingId);
      Render.renderReplyingBanner(replyingTo ? Model.findById(state.messages, replyingTo) : null);
    }

    function persist() {
      const res = Store.save(state);
      if (!res.ok) Render.setStatus(res.error, "error");
    }

    function autosize() {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 160) + "px";
    }
    const refreshSendState = () => { sendBtn.disabled = input.value.trim().length === 0; };

    function handleSend() {
      const check = Model.validateBody(input.value);
      if (!check.ok) {
        if (check.reason === "too-long")
          Render.setStatus("Message is too long (max " + Model.MAX_LEN + " characters).", "error");
        return;
      }
      state.messages.push(Model.createMessage(check.body, "You", replyingTo));
      replyingTo = null;
      persist();
      Render.setStatus(null);
      input.value = ""; autosize(); refreshSendState();
      rerender();
      input.focus();
    }

    function handleKeydown(e) {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); }
    }

    // Event delegation for per-message actions.
    function handleLogClick(e) {
      const btn = e.target.closest("[data-action]");
      if (!btn) return;
      const { action, id } = btn.dataset;

      if (action === "reply") {
        replyingTo = id; editingId = null; rerender(); input.focus();
      } else if (action === "edit") {
        editingId = id; replyingTo = replyingTo === id ? null : replyingTo; rerender();
        const ta = logEl.querySelector('[data-edit-input="' + CSS.escape(id) + '"]');
        if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
      } else if (action === "edit-cancel") {
        editingId = null; rerender();
      } else if (action === "edit-save") {
        const ta = logEl.querySelector('[data-edit-input="' + CSS.escape(id) + '"]');
        const check = Model.validateBody(ta ? ta.value : "");
        if (!check.ok) {
          Render.setStatus(check.reason === "too-long"
            ? "Message is too long (max " + Model.MAX_LEN + " characters)."
            : "Message can't be empty.", "error");
          return;
        }
        state.messages = Model.editMessage(state.messages, id, check.body);
        editingId = null; persist(); Render.setStatus(null); rerender();
      } else if (action === "delete") {
        if (!confirm("Delete this message? This can't be undone.")) return;
        state.messages = Model.deleteMessage(state.messages, id);
        if (replyingTo === id) replyingTo = null;
        if (editingId === id) editingId = null;
        persist(); rerender();
      }
    }

    function handleExport() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "reis-messages-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      URL.revokeObjectURL(url);
    }

    function handleImport(file) {
      const reader = new FileReader();
      reader.onload = () => {
        const res = Store.importJSON(String(reader.result));
        if (res.error) { Render.setStatus("Import failed: " + res.error, "error"); return; }
        const count = res.state.messages.length;
        if (!confirm("Import " + count + " message" + (count === 1 ? "" : "s") +
            "? This replaces your current messages.")) return;
        state = res.state;
        replyingTo = null; editingId = null;
        persist();
        Render.setStatus("Imported " + count + " message" + (count === 1 ? "" : "s") + ".", "info");
        rerender();
      };
      reader.onerror = () => Render.setStatus("Could not read the selected file.", "error");
      reader.readAsText(file);
    }

    function init() {
      const loaded = Store.load();
      state = loaded.state;
      if (loaded.warning) Render.setStatus(loaded.warning, "error");
      rerender();

      form.addEventListener("submit", (e) => { e.preventDefault(); handleSend(); });
      input.addEventListener("keydown", handleKeydown);
      input.addEventListener("input", () => { autosize(); refreshSendState(); });
      logEl.addEventListener("click", handleLogClick);
      replyingCancel.addEventListener("click", () => { replyingTo = null; rerender(); input.focus(); });

      exportBtn.addEventListener("click", handleExport);
      importBtn.addEventListener("click", () => importFile.click());
      importFile.addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) handleImport(file);
        importFile.value = "";   // allow re-importing the same file
      });

      refreshSendState();
      input.focus();
    }

    return { init };
  })();

  Controller.init();
})();
</script>
